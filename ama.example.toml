# AMA keeps its settings in `ama.toml`, in %LOCALAPPDATA%\AMA unless you start it
# with `--config` or the AMA_CONFIG environment variable pointing at another file.
# The Settings page in the web UI edits it for you, or you can edit it by hand.
# Every setting is listed here with its default. A misspelt or unknown setting
# stops AMA at startup with an error naming it.
#
# Relative paths are relative to the folder `ama.toml` is in. Strings in single
# quotes are taken literally, so Windows paths need no escaping.

[web]
# The web UI you use from any device on your network. Changes apply after a restart.

# Address and port the web UI listens on. 0.0.0.0 makes it reachable from your
# whole network; 127.0.0.1 keeps it to this PC.
host = "0.0.0.0"
port = 8080
# Password for the web UI, shared by everyone who uses it. SECRET. Empty = no
# sign-in, so anyone on your network can use AMA.
password = ""

[drive]
# The optical drive AMA watches for Discs. Changes apply after a restart.

# Drive letter, e.g. "D:". Empty = the first optical drive Windows reports.
letter = ""
# How often to check the drive for a Disc being inserted or removed, in seconds.
poll_seconds = 3

[tools]
# The programs AMA runs. AMA downloads its own checked copies of ffmpeg and
# ffprobe (for Encodes) and cyanrip (for CD Rips) when it starts; the first start
# needs internet and about 0.5 GB. Changes apply after a restart.

# Folder for AMA's own copies. Empty = %LOCALAPPDATA%\AMA\tools.
dir = ""
# Full path to a program to use instead of AMA's own copy. It's used as it is, with
# no download or version check. Empty = AMA's own copy.
ffmpeg = ""
ffprobe = ""
cyanrip = ""
# Full path to MakeMKV's `makemkvcon.exe`. MakeMKV is yours to install and
# register; AMA never does either. Empty = look in C:\Program Files (x86)\MakeMKV
# and C:\Program Files\MakeMKV.
makemkvcon = ""

[cd]
# How audio CDs are read.

# Your drive's read offset in samples (EAC convention). The default, +667, suits a
# PIONEER BDR-S11JX; look yours up in the AccurateRip drive list, or confirm it once
# with `cyanrip -f`.
offset = 667
# How many times to re-read a part of the CD that read badly before counting it
# as an error.
retries = 10

[paths]
# Where AMA keeps its working files. Changes apply after a restart.

# Scratch folder for Rips waiting for Identification, Review and Encode. Put it on
# a fast local drive with at least 256 GB free. Created if missing.
scratch = 'D:\ama-scratch'
# AMA's database of Jobs and History.
state_db = "ama.sqlite3"
# AMA's log file, rotated as it grows. AMA also logs to its console window when
# it has one.
log_file = 'logs\ama.log'

[scratch]
# How AMA keeps the scratch folder from filling up.

# Free space (GB) each Disc Type needs before its Rip starts. With less free, an
# inserted Disc is ejected unripped and the UI shows what is using scratch space
# (finishing a Review, or an Encode being filed, frees some).
cd = 1
dvd = 10
bd = 50
uhd = 100
# Days to keep a failed Encode's Rip, so you can retry it; 0 keeps it until you
# remove it. Older ones are removed, oldest first, at startup, every hour and when
# a Job finishes. Each removal is listed in Logs.
retention_days = 0
# Free space (GB) to keep on scratch. With less free, kept Rips are removed
# whatever their age, oldest first, until there's enough; 0 turns this off.
floor_gb = 0

[rip.min_title_seconds]
# Which video Titles are ripped.

# The shortest Title ripped, in whole seconds, per Disc Type. Shorter Titles are
# menus, logos and warnings. Each Job records the minimum its Rip used.
dvd = 30
bd = 30
uhd = 30

[tmdb]
# The Movie Database (TMDB), which AMA uses to identify films and TV series.

# Your TMDB API key (the v3 "API Key" from your TMDB account settings). SECRET.
api_key = ""

[plex]
# Plex Media Server, which AMA tells to scan each folder it files.

# Your Plex server's address. AMA uses it to start a scan of each filed folder,
# and to list your Plex libraries in Settings > Archive > Libraries.
url = "http://nas:32400"
# Your Plex token (X-Plex-Token). SECRET. With no address or no token, AMA starts
# no scans and Plex finds new folders at its next scheduled scan.
token = ""
# Where the Plex server sees your Library folders, when Plex runs on another
# machine. Each Library folder is this path plus the folder's own name: e.g.
# '/volume1/media' when Plex on a NAS sees \\nas\media\Movies as
# /volume1/media/Movies. Empty = Plex sees each folder at the same path AMA does.
libraries_path = ""

[discord]
# Alerts in a Discord channel.

# The channel's webhook URL. SECRET. Empty = no Discord alerts.
webhook_url = ""

[ntfy]
# Push alerts to your phone through ntfy.

# The ntfy server: the public one, or your own.
url = "https://ntfy.sh"
# The topic to post to. Anyone who knows it can read your alerts, so treat it as
# a SECRET. Empty = no ntfy alerts.
topic = ""

[webhook]
# Alerts sent to anything that takes a JSON POST, e.g. Home Assistant or your own
# script.

# The URL to POST each alert to. SECRET. Empty = no webhook alerts. The body is
# versioned JSON:
#   {"version": 1, "event": "job_filed", "at": "2026-11-05T12:00:00Z",
#    "job": {"id": 7, "disc_type": "bd", "title": "...", "status": "filed", "url": "..."}}
# `event` is rip_done, review_needed, job_filed, job_failed, or test (from "Send
# test", with `job` null).
url = ""
# A header to send with every POST, e.g. one holding a token the receiver checks.
# It's only sent when both its name and its value are set.
header_name = ""
# The header's value. SECRET.
header_value = ""

[encode]
# How video Discs are Encoded. Archives are always MKV at a constant quality.
# Changes apply to Jobs whose Encode hasn't started.

# Encoder: hevc_nvenc (NVIDIA HEVC), av1_nvenc (NVIDIA AV1), hevc_qsv (Intel Quick
# Sync HEVC) or libx265 (HEVC on the processor, very slow for UHD). AMA
# test-encodes with each one at startup and when you save; one that fails can't be
# picked in Settings.
encoder = "hevc_nvenc"
# Speed, in the same four steps on every encoder: faster, balanced, slower,
# slowest. Slower makes smaller files at the same quality.
speed = "slower"
# Sound tracks: all (copy every track), first_plus_stereo (the first track plus an
# AAC stereo copy that plays everywhere) or languages (tracks in your preferred
# languages, commentaries too, plus the film's original language).
audio = "languages"
# Subtitles: all, languages (your preferred languages, plus untagged forced ones)
# or none.
subtitles = "languages"
# Your preferred languages, most preferred first: names (English, Japanese) or
# codes (en, ja), separated by commas.
languages = "English"

[encode.cq]
# Picture quality of each Encode.

# Constant-quality level per Disc Type (CQ, or CRF for libx265): 0 to 51, where
# lower is better quality and bigger files. Encodes are your permanent Archive,
# so settle these before archiving your collection. CDs are never Encoded.
dvd = 20
bd = 22
uhd = 22

[encode.max_resolution]
# Picture size of each Encode.

# The tallest picture kept per Disc Type: keep (the Disc's own), or 720p for
# Blu-ray and 1080p for UHD Blu-ray (scaled down, HDR kept).
dvd = "keep"
bd = "keep"
uhd = "keep"

[logs]
# How long Logs keep each step's output.

# Days to keep each step's output; 0 keeps it forever. Older output is removed at
# startup and once a day. Jobs, History and run summaries are always kept.
keep_days = 0

# Libraries: the named folders of your Archive, one [[libraries]] entry each.
# Each kind (films, tv or music) needs exactly one default Library; a Job is filed
# to its kind's default unless you pick another Library of that kind. Leave out
# every entry to use Videos\Movies, Videos\TV and Music in your user folder.
[[libraries]]
# The Library's name, shown in AMA.
name = "Movies"
# What it holds: films, tv or music.
kind = "films"
# Its full folder path: a local folder, a mapped drive or a network (UNC) path,
# created when AMA first files to it. AMA doesn't connect or mount anything: while
# the folder can't be reached, its Jobs wait and filing is retried every minute.
path = '\\nas\media\Movies'
# The Plex library that holds it, scanned after each filing. Empty = whichever
# Plex library's folder contains it.
plex = "Movies"
# Whether it's the default Library for its kind.
default = true
# Films and TV only, for now: the Library's Naming Pattern, the folders and file name
# inside it, from {title}, {year}, {tmdb_id} and {version} (4K, 1080p, or nothing
# for a DVD), "/" between folders. Empty = Plex's naming,
# "{title} ({year}) {{tmdb-{tmdb_id}}}/{title} ({year}) {{tmdb-{tmdb_id}}} - {version}".
# Changing it names only what is filed afterwards; nothing filed is renamed.
pattern = ""

[[libraries]]
name = "TV"
kind = "tv"
path = '\\nas\media\TV'
plex = "TV Shows"
default = true
# The TV Library's Naming Pattern: every Episode's folders and file name, from
# {show}, {year}, {tmdb_id}, {season} (0 for specials), {episode} and
# {episode_title}. The first folder is the show's, where its Extras go in Other;
# {episode} and {episode_title} only in the file name. Empty = Plex's naming,
# "{show} ({year}) {{tmdb-{tmdb_id}}}/Season {season:02}/{show} - s{season:02}e{episode:02} - {episode_title}".
# Changing it names only what is filed afterwards; nothing filed is renamed.
pattern = ""

[[libraries]]
name = "Music"
kind = "music"
path = '\\nas\media\Music'
plex = "Music"
default = true
