[project]
name = "ama"
version = "0.1.0"
description = "Automatic Media Archive: rip, identify, encode and file optical Discs into a Plex library"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "mutagen>=1.48.1",
    "httpx>=0.28",
    "tomlkit>=0.13",
    "pystray>=0.19 ; sys_platform == 'win32'",
    "pillow>=11 ; sys_platform == 'win32'",
]

[project.scripts]
ama = "ama.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
