{#- A Job's log. Needs `log_lines`. -#}
<section class="bin ink" aria-labelledby="log-h" id="log">
  <h2 class="tab" id="log-h">Log</h2>
  <div class="box">
    <details{% if log_open %} open{% endif %}>
      <summary><svg class="i" aria-hidden="true"><use href="/static/icons.svg#log"/></svg>Show the full log</summary>
<div class="log">{% for ln in log_lines %}{% if ln.error %}<span class="e">{{ ln }}</span>{% else %}{{ ln }}{% endif %}
{% endfor %}</div>
    </details>
  </div>
</section>
