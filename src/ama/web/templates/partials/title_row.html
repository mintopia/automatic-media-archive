{%- set n = t.title.number -%}
<div class="title-row"><input type="radio" id="title-{{ n }}" aria-labelledby="title-{{ n }}-name" aria-describedby="title-{{ n }}-note" name="title" value="{{ n }}"{% if picked_title and n == picked_title.number %} checked{% endif %}><label for="title-{{ n }}"><div class="tt" id="title-{{ n }}-name">{{ t.label }}</div><div class="ts" id="title-{{ n }}-note">{{ t.note }}</div></label><label class="shots" for="title-{{ n }}" aria-hidden="true">{% include "partials/title_frames.html" %}</label></div>
