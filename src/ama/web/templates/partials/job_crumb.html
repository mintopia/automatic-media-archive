{#- A Job page's breadcrumb: the section its Phase puts it in (Now / Review / History). -#}
<div class="crumb" id="job-crumb"{% if oob %} hx-swap-oob="true"{% endif %}>{% if section.href != "/" %}<a href="/">Now</a><svg class="i" aria-hidden="true"><use href="/static/icons.svg#chevron"/></svg>{% endif %}<a href="{{ section.href }}">{{ section.label }}</a><svg class="i" aria-hidden="true"><use href="/static/icons.svg#chevron"/></svg><span>{{ job_name }}</span>{% include "partials/job_log_link.html" %}</div>
