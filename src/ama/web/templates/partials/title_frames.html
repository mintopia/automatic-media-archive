<div class="frames"{% if t.pending %} hx-get="/review/{{ record.id }}/titles/{{ t.title.number }}/frames" hx-trigger="load delay:2s" hx-swap="outerHTML"{% endif %}>{% for f in t.frames %}{% if f.src %}<div class="frame"><img src="{{ f.src }}" alt="Title {{ t.title.number }} at {{ f.pct }}%" loading="lazy"><span>{{ f.pct }}%</span></div>{% else %}<div class="frame">{{ f.pct }}%<span class="ts">{{ "…" if t.pending else "No picture" }}</span></div>{% endif %}{% endfor %}</div>
