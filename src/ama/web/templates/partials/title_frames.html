<div class="frames"{% if t.pending %} aria-busy="true" hx-get="/review/{{ record.id }}/titles/{{ t.title.number }}/frames" hx-trigger="load delay:2s" hx-swap="outerHTML"{% endif %}>{% for f in t.frames %}{% if f.src %}<div class="frame"><img src="{{ f.src }}" alt="Title {{ t.title.number }} at {{ f.pct }}%" loading="lazy"><span>{{ f.pct }}%</span></div>{% elif t.pending %}<div class="frame">{{ f.pct }}%<span class="ts"><span aria-hidden="true">…</span><span class="sr">picture loading</span></span></div>{% else %}<div class="frame">{{ f.pct }}%<span class="ts">No picture</span></div>{% endif %}{% endfor %}</div>
