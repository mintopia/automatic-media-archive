{#- A Job page's Waiting line, kept live: re-fetched from /jobs/{id}/waiting on every
    "problems" SSE event (a fragment can't know which Job's page it's on). Needs `job_id`. -#}
{%- from "partials/waiting_line.html" import line -%}
<div hx-get="/jobs/{{ job_id }}/waiting" hx-trigger="sse:problems" hx-swap="outerHTML">{{ line(waiting_for(job_id)) }}</div>
